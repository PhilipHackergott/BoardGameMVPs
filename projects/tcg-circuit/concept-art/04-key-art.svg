<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Trebuchet MS',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0920"/><stop offset="0.6" stop-color="#1a1338"/><stop offset="1" stop-color="#2a1b40"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e0"/><stop offset="0.35" stop-color="#ffd86b"/><stop offset="0.7" stop-color="#ff9a3c" stop-opacity="0.5"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c66"/><stop offset="1" stop-color="#191130"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2147"/><stop offset="1" stop-color="#160f2c"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#sky)"/>

  <!-- big screen -->
  <g transform="translate(330,40)">
    <rect x="0" y="0" width="300" height="120" rx="8" fill="#0a0818" stroke="#4a3d7a" stroke-width="3"/>
    <text x="150" y="46" text-anchor="middle" font-size="30" font-weight="bold" fill="#6fd0ff" letter-spacing="6" opacity="0.85">WORLDS</text>
    <g stroke="#3a6a8a" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 30 70 h 40 v 14 h 40"/><path d="M 30 96 h 40 v -12 h 40"/>
      <path d="M 230 70 h -40 v 14 h -40"/><path d="M 230 96 h -40 v -12 h -40"/>
    </g>
  </g>

  <!-- WORLD CHAMPIONSHIP banner -->
  <g transform="translate(230,10)">
    <rect x="0" y="0" width="500" height="32" rx="8" fill="#d9442e" stroke="#ffd86b" stroke-width="2"/>
    <text x="250" y="23" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff6df" letter-spacing="3">★  WORLD CHAMPIONSHIP  ★</text>
  </g>

  <!-- spotlights -->
  <polygon points="120,40 -40,420 300,420" fill="url(#spot)"/>
  <polygon points="840,40 1000,420 660,420" fill="url(#spot)"/>
  <polygon points="480,30 360,460 600,460" fill="url(#spot)" opacity="0.8"/>

  <!-- crowd silhouettes -->
  <g fill="#0a0818">
    <rect x="0" y="350" width="960" height="60"/>
    <g fill="#120d28">
      <circle cx="40" cy="352" r="18"/><circle cx="90" cy="356" r="16"/><circle cx="140" cy="350" r="19"/><circle cx="195" cy="356" r="17"/>
      <circle cx="250" cy="352" r="18"/><circle cx="305" cy="356" r="16"/><circle cx="360" cy="351" r="18"/><circle cx="600" cy="352" r="18"/>
      <circle cx="655" cy="356" r="16"/><circle cx="710" cy="350" r="19"/><circle cx="765" cy="356" r="17"/><circle cx="820" cy="352" r="18"/>
      <circle cx="875" cy="356" r="16"/><circle cx="925" cy="351" r="18"/>
    </g>
  </g>

  <!-- stage floor -->
  <polygon points="120,410 840,410 960,600 0,600" fill="url(#stage)"/>
  <polygon points="120,410 840,410 855,430 105,430" fill="#5a4a9a" opacity="0.6"/>
  <ellipse cx="480" cy="470" rx="300" ry="36" fill="#ffd86b" opacity="0.12"/>

  <!-- central energy burst + hero card -->
  <circle cx="480" cy="300" r="180" fill="url(#burst)"/>
  <g transform="translate(480,300)">
    <g stroke="#fff8e0" stroke-width="3" opacity="0.5">
      <line x1="0" y1="-150" x2="0" y2="-90"/><line x1="0" y1="150" x2="0" y2="90"/>
      <line x1="-150" y1="0" x2="-90" y2="0"/><line x1="150" y1="0" x2="90" y2="0"/>
      <line x1="-106" y1="-106" x2="-64" y2="-64"/><line x1="106" y1="106" x2="64" y2="64"/>
      <line x1="106" y1="-106" x2="64" y2="-64"/><line x1="-106" y1="106" x2="-64" y2="64"/>
    </g>
    <!-- the glowing card -->
    <g transform="rotate(-6)">
      <rect x="-52" y="-78" width="104" height="156" rx="12" fill="#1a1338" stroke="#ffd86b" stroke-width="4"/>
      <rect x="-42" y="-50" width="84" height="64" rx="6" fill="#3a2c66"/>
      <polygon points="0,-44 9,-22 32,-22 14,-8 21,14 0,1 -21,14 -14,-8 -32,-22 -9,-22" fill="#ffe08a"/>
      <text x="0" y="40" text-anchor="middle" font-size="11" fill="#fff6df" font-weight="bold">PRISM</text>
      <text x="0" y="58" text-anchor="middle" font-size="8" fill="#cbb8f0">— the card that started it all —</text>
    </g>
  </g>

  <!-- trophy (foreground center) -->
  <g transform="translate(480,500)">
    <rect x="-26" y="44" width="52" height="14" rx="3" fill="url(#gold)" stroke="#9c6f1c" stroke-width="1.5"/>
    <rect x="-14" y="28" width="28" height="20" fill="url(#gold)"/>
    <path d="M -34 -6 Q -34 40 0 40 Q 34 40 34 -6 Z" fill="url(#gold)" stroke="#9c6f1c" stroke-width="1.5"/>
    <path d="M -34 -6 Q -60 -6 -54 18 Q -48 30 -34 24" fill="none" stroke="#d99a2b" stroke-width="5"/>
    <path d="M 34 -6 Q 60 -6 54 18 Q 48 30 34 24" fill="none" stroke="#d99a2b" stroke-width="5"/>
    <rect x="-36" y="-12" width="72" height="10" rx="4" fill="#fff3c4"/>
    <polygon points="0,-44 6,-30 21,-30 9,-21 14,-7 0,-16 -14,-7 -9,-21 -21,-30 -6,-30" fill="#fff8e0" opacity="0.9"/>
  </g>

  <!-- PROTAGONIST (left) -->
  <g transform="translate(250,300)">
    <ellipse cx="0" cy="190" rx="60" ry="16" fill="#000" opacity="0.3"/>
    <!-- legs/body -->
    <rect x="-26" y="70" width="22" height="80" rx="6" fill="#2a3a6a"/><rect x="4" y="70" width="22" height="80" rx="6" fill="#2a3a6a"/>
    <rect x="-34" y="6" width="68" height="78" rx="14" fill="#d9442e"/>
    <rect x="-34" y="6" width="68" height="26" rx="14" fill="#e8643f"/>
    <text x="0" y="56" text-anchor="middle" font-size="22" fill="#ffd86b" font-weight="bold">★</text>
    <!-- raised arm holding card -->
    <rect x="22" y="-30" width="18" height="56" rx="8" fill="#e8643f" transform="rotate(28 31 -2)"/>
    <g transform="translate(58,-58) rotate(18)"><rect x="-16" y="-22" width="34" height="48" rx="5" fill="#fff6e8" stroke="#d9442e" stroke-width="3"/><circle cx="0" cy="2" r="9" fill="#d9442e"/></g>
    <!-- head -->
    <circle cx="0" cy="-22" r="26" fill="#f1c79b" stroke="#caa278" stroke-width="2"/>
    <path d="M -28 -26 Q 0 -56 28 -26 L 28 -36 Q 0 -52 -28 -36 Z" fill="#5a3a1a"/>
    <path d="M -28 -26 Q -30 -34 -22 -40" fill="none" stroke="#5a3a1a" stroke-width="6"/>
    <circle cx="-9" cy="-22" r="3" fill="#2a2440"/><circle cx="9" cy="-22" r="3" fill="#2a2440"/>
    <path d="M -8 -10 Q 0 -4 8 -10" stroke="#a06a4a" stroke-width="2.5" fill="none"/>
  </g>
  <text x="250" y="520" text-anchor="middle" font-size="13" fill="#ffd1ba" font-weight="bold">YOU</text>

  <!-- RIVAL (right) -->
  <g transform="translate(710,300)">
    <ellipse cx="0" cy="190" rx="60" ry="16" fill="#000" opacity="0.3"/>
    <rect x="-26" y="70" width="22" height="80" rx="6" fill="#241830"/><rect x="4" y="70" width="22" height="80" rx="6" fill="#241830"/>
    <rect x="-34" y="6" width="68" height="78" rx="14" fill="#5a3f8a"/>
    <rect x="-34" y="6" width="68" height="26" rx="14" fill="#6e50a6"/>
    <!-- crossed-arm card held to chest -->
    <g transform="translate(-2,30) rotate(-12)"><rect x="-16" y="-22" width="34" height="48" rx="5" fill="#fff6e8" stroke="#7d5aa6" stroke-width="3"/><circle cx="0" cy="2" r="9" fill="#7d5aa6"/></g>
    <rect x="-40" y="34" width="40" height="16" rx="8" fill="#6e50a6" transform="rotate(-14 -20 42)"/>
    <!-- head -->
    <circle cx="0" cy="-22" r="26" fill="#e8b98a" stroke="#c79468" stroke-width="2"/>
    <path d="M -28 -28 Q 0 -54 28 -28 L 30 -16 Q 14 -30 0 -28 Q -14 -30 -30 -16 Z" fill="#1f1730"/>
    <circle cx="-9" cy="-22" r="3" fill="#2a2440"/><circle cx="9" cy="-22" r="3" fill="#2a2440"/>
    <path d="M -8 -8 Q 0 -12 8 -8" stroke="#8a5a3a" stroke-width="2.5" fill="none"/>
  </g>
  <text x="710" y="520" text-anchor="middle" font-size="13" fill="#cbb8f0" font-weight="bold">THE RIVAL</text>

  <!-- VS -->
  <text x="480" y="120" text-anchor="middle" font-size="20" fill="#ffd86b" font-weight="bold" opacity="0.0">VS</text>

  <!-- title bar -->
  <g transform="translate(180,548)">
    <rect x="0" y="0" width="600" height="44" rx="12" fill="url(#titlebar)" stroke="#ffd86b" stroke-width="3"/>
    <text x="300" y="22" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffe9a0" letter-spacing="2">TCG CIRCUIT</text>
    <text x="300" y="38" text-anchor="middle" font-size="10" fill="#cbb8f0" font-style="italic">from the local card shop to the World Championship — working title</text>
  </g>
</svg>
