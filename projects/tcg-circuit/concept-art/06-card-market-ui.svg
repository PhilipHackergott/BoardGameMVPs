  <!-- sidebar: watchlist + hot -->
  <g transform="translate(648,156)">
    <rect x="0" y="0" width="226" height="22" class="th"/><text class="thtxt" x="8" y="15">★ YOUR WATCHLIST</text>
    <rect x="0" y="22" width="226" height="120" fill="#fbf3df" stroke="#8a8f9c"/>
    <g transform="translate(10,30)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="#15301a" stroke="#4a9e4a" stroke-width="2"/>
      <text x="30" y="13" font-size="11" fill="#2a2440" font-weight="bold">Oak Warden</text><text x="30" y="26" font-size="10" fill="#1f6b2a">¤84 ▲ +9%</text>
    </g>
    <g transform="translate(10,68)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="#142634" stroke="#2e7fb8" stroke-width="2"/>
      <text x="30" y="13" font-size="11" fill="#2a2440" font-weight="bold">Tidal Pull ✦</text><text x="30" y="26" font-size="10" fill="#1f6b2a">¤156 ▲ +21%</text>
    </g>
    <g transform="translate(10,106)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="#2a1814" stroke="#d9442e" stroke-width="2"/>
      <text x="30" y="13" font-size="11" fill="#2a2440" font-weight="bold">Cinder Rite</text><text x="30" y="26" font-size="10" fill="#b6391f">¤12 ▼ −4%</text>
    </g>

    <rect x="0" y="156" width="226" height="22" class="th"/><text class="thtxt" x="8" y="171">🔥 HOT THIS WEEK</text>
    <rect x="0" y="178" width="226" height="120" fill="#fbf3df" stroke="#8a8f9c"/>
    <g font-size="11" fill="#2a2440">
      <text x="10" y="198">1. Tidal Pull ✦ <tspan fill="#1f6b2a">+21%</tspan></text>
      <text x="10" y="218">2. Oak Warden <tspan fill="#1f6b2a">+9%</tspan></text>
      <text x="10" y="238">3. Spadeworn Knight <tspan fill="#1f6b2a">+7%</tspan></text>
      <text x="10" y="258">4. Dusk Wraith <tspan fill="#b6391f">−3%</tspan></text>
      <text x="10" y="278">5. Ember Whelp <tspan fill="#5b6070">±0%</tspan></text>
      <text x="10" y="292" font-size="9" fill="#5b6070">driven by the new metagame...</text>
    </g>
  </g>

  <text x="450" y="600" text-anchor="middle" fill="#5b6070" font-size="11">CONCEPT — online singles market (in-fiction web; world feature, concept only)</text>
</svg>
