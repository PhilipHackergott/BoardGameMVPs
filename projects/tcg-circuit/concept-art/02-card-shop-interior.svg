<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Trebuchet MS',sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5736"/><stop offset="1" stop-color="#9c764a"/>
    </linearGradient>
    <pattern id="floor" width="60" height="48" patternUnits="userSpaceOnUse">
      <rect width="60" height="48" fill="#caa56e"/>
      <rect width="30" height="24" fill="#bd9760"/>
      <rect x="30" y="24" width="30" height="24" fill="#bd9760"/>
    </pattern>
    <radialGradient id="lamp" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.85"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0573f"/><stop offset="1" stop-color="#b6391f"/></linearGradient>
    <linearGradient id="boxb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fc0"/><stop offset="1" stop-color="#2a6694"/></linearGradient>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa24f"/><stop offset="1" stop-color="#367d36"/></linearGradient>
    <linearGradient id="boxp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5aa6"/><stop offset="1" stop-color="#573f7d"/></linearGradient>
    <linearGradient id="boxy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c84a"/><stop offset="1" stop-color="#c2a52f"/></linearGradient>
  </defs>

  <!-- wall + floor -->
  <rect width="900" height="372" fill="url(#wall)"/>
  <rect y="372" width="900" height="188" fill="url(#floor)"/>
  <rect y="364" width="900" height="14" fill="#5e4326"/>

  <!-- hanging lamps + glow -->
  <g>
    <rect x="246" y="0" width="6" height="40" fill="#3a2a1a"/><ellipse cx="249" cy="44" rx="24" ry="10" fill="#2a2440"/><ellipse cx="249" cy="42" rx="20" ry="7" fill="#ffe08a"/>
    <polygon points="249,48 130,372 368,372" fill="url(#lamp)"/>
    <rect x="648" y="0" width="6" height="40" fill="#3a2a1a"/><ellipse cx="651" cy="44" rx="24" ry="10" fill="#2a2440"/><ellipse cx="651" cy="42" rx="20" ry="7" fill="#ffe08a"/>
    <polygon points="651,48 532,372 770,372" fill="url(#lamp)"/>
  </g>

  <!-- neon CARD SHOP sign -->
  <g transform="translate(330,28)">
    <rect x="0" y="0" width="240" height="56" rx="10" fill="#1f1733" stroke="#ff5fa2" stroke-width="3"/>
    <text x="120" y="38" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffd1e8" stroke="#ff5fa2" stroke-width="0.6" letter-spacing="3">CARD SHOP</text>
  </g>

  <!-- left shelf of booster boxes -->
  <g transform="translate(24,120)">
    <rect x="-6" y="-6" width="190" height="252" rx="6" fill="#5e4326"/>
    <g>
      <rect x="6" y="4" width="40" height="56" rx="3" fill="url(#boxr)" stroke="#7a2414" stroke-width="1.5"/>
      <rect x="52" y="4" width="40" height="56" rx="3" fill="url(#boxb)" stroke="#1d4d72" stroke-width="1.5"/>
      <rect x="98" y="4" width="40" height="56" rx="3" fill="url(#boxg)" stroke="#27602a" stroke-width="1.5"/>
      <rect x="144" y="4" width="40" height="56" rx="3" fill="url(#boxp)" stroke="#3f2d5e" stroke-width="1.5"/>
    </g>
    <rect x="-6" y="66" width="190" height="8" fill="#4a341f"/>
    <g transform="translate(0,80)">
      <rect x="6" y="4" width="40" height="56" rx="3" fill="url(#boxy)" stroke="#9c8226" stroke-width="1.5"/>
      <rect x="52" y="4" width="40" height="56" rx="3" fill="url(#boxr)" stroke="#7a2414" stroke-width="1.5"/>
      <rect x="98" y="4" width="40" height="56" rx="3" fill="url(#boxb)" stroke="#1d4d72" stroke-width="1.5"/>
      <rect x="144" y="4" width="40" height="56" rx="3" fill="url(#boxg)" stroke="#27602a" stroke-width="1.5"/>
    </g>
    <rect x="-6" y="146" width="190" height="8" fill="#4a341f"/>
    <g transform="translate(0,160)">
      <rect x="6" y="4" width="40" height="56" rx="3" fill="url(#boxp)" stroke="#3f2d5e" stroke-width="1.5"/>
      <rect x="52" y="4" width="40" height="56" rx="3" fill="url(#boxg)" stroke="#27602a" stroke-width="1.5"/>
      <rect x="98" y="4" width="40" height="56" rx="3" fill="url(#boxy)" stroke="#9c8226" stroke-width="1.5"/>
      <rect x="144" y="4" width="40" height="56" rx="3" fill="url(#boxr)" stroke="#7a2414" stroke-width="1.5"/>
    </g>
    <rect x="-10" y="232" width="198" height="14" fill="#4a341f"/>
    <rect x="36" y="-30" width="110" height="20" rx="5" fill="#2a2440" stroke="#f4c430" stroke-width="2"/>
    <text x="91" y="-15" text-anchor="middle" font-size="11" fill="#fff6df" font-weight="bold">BOOSTERS</text>
  </g>

  <!-- bulletin board -->
  <g transform="translate(720,118)">
    <rect x="0" y="0" width="150" height="120" rx="5" fill="#8a6238" stroke="#5e4326" stroke-width="6"/>
    <rect x="14" y="14" width="48" height="40" fill="#f3e8cf" transform="rotate(-4 38 34)"/>
    <rect x="78" y="12" width="54" height="36" fill="#dceaf6" transform="rotate(3 105 30)"/>
    <rect x="20" y="66" width="56" height="40" fill="#f6dce4" transform="rotate(2 48 86)"/>
    <rect x="88" y="64" width="46" height="44" fill="#e6f6dc" transform="rotate(-3 111 86)"/>
    <text x="75" y="-8" text-anchor="middle" font-size="11" fill="#fff6df" font-weight="bold">★ EVENTS ★</text>
  </g>

  <!-- play table with two duelists -->
  <g transform="translate(450,392)">
    <ellipse cx="0" cy="70" rx="200" ry="34" fill="#000" opacity="0.15"/>
    <!-- far player -->
    <g transform="translate(0,-92)">
      <circle cx="0" cy="0" r="20" fill="#f1c79b" stroke="#caa278" stroke-width="2"/>
      <path d="M -22 -4 Q 0 -28 22 -4 L 22 -12 Q 0 -24 -22 -12 Z" fill="#5a3a8a"/>
      <circle cx="-7" cy="2" r="2.5" fill="#2a2440"/><circle cx="7" cy="2" r="2.5" fill="#2a2440"/>
      <path d="M -6 10 Q 0 14 6 10" stroke="#a06a4a" stroke-width="2" fill="none"/>
      <rect x="-30" y="18" width="60" height="34" rx="8" fill="#3f8fc0"/>
    </g>
    <!-- table -->
    <rect x="-200" y="-30" width="400" height="64" rx="14" fill="#2f7d4f" stroke="#1f5e38" stroke-width="4"/>
    <rect x="-200" y="34" width="400" height="20" rx="6" fill="#1f5e38"/>
    <!-- cards on table (the duel) -->
    <g>
      <rect x="-150" y="-18" width="34" height="46" rx="4" fill="#fff6e8" stroke="#caa24a" stroke-width="2" transform="rotate(-6 -133 5)"/>
      <rect x="-100" y="-14" width="34" height="46" rx="4" fill="#fff6e8" stroke="#d9442e" stroke-width="2"/>
      <rect x="70" y="-16" width="34" height="46" rx="4" fill="#fff6e8" stroke="#3f8fc0" stroke-width="2" transform="rotate(5 87 7)"/>
      <rect x="118" y="-14" width="34" height="46" rx="4" fill="#fff6e8" stroke="#4fa24f" stroke-width="2"/>
    </g>
    <!-- near player (back) -->
    <g transform="translate(0,60)">
      <rect x="-34" y="-6" width="68" height="42" rx="10" fill="#d9442e"/>
      <circle cx="0" cy="-18" r="22" fill="#3a2a1a"/>
      <path d="M -22 -22 Q 0 -40 22 -22 L 22 -28 Q 0 -38 -22 -28 Z" fill="#241a0f"/>
      <!-- fanned hand -->
      <g transform="translate(0,30)">
        <rect x="-46" y="-10" width="26" height="38" rx="3" fill="#fff6e8" stroke="#6b4c8a" stroke-width="2" transform="rotate(-18 -33 9)"/>
        <rect x="-26" y="-14" width="26" height="38" rx="3" fill="#fff6e8" stroke="#d9442e" stroke-width="2" transform="rotate(-7 -13 5)"/>
        <rect x="-6" y="-16" width="26" height="38" rx="3" fill="#fff6e8" stroke="#3f8fc0" stroke-width="2"/>
        <rect x="14" y="-14" width="26" height="38" rx="3" fill="#fff6e8" stroke="#4fa24f" stroke-width="2" transform="rotate(8 27 5)"/>
      </g>
    </g>
  </g>

  <!-- counter + shop owner (right) -->
  <g transform="translate(560,300)">
    <!-- owner -->
    <g transform="translate(150,-8)">
      <rect x="-26" y="6" width="52" height="50" rx="10" fill="#5a3a8a"/>
      <circle cx="0" cy="-12" r="20" fill="#e8b98a" stroke="#c79468" stroke-width="2"/>
      <path d="M -22 -16 Q 0 -34 22 -16 L 22 -22 Q 0 -30 -22 -22 Z" fill="#7a5a3a"/>
      <rect x="-22" y="-20" width="44" height="8" rx="3" fill="#caa24a"/>
      <circle cx="-7" cy="-10" r="2.5" fill="#2a2440"/><circle cx="7" cy="-10" r="2.5" fill="#2a2440"/>
      <path d="M -7 0 Q 0 5 7 0" stroke="#8a5a3a" stroke-width="2" fill="none"/>
    </g>
    <!-- glass counter -->
    <rect x="0" y="40" width="300" height="20" rx="4" fill="#7a5736"/>
    <rect x="0" y="0" width="300" height="42" rx="4" fill="#cfe7f2" opacity="0.55" stroke="#aebfc9" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="42" stroke="#aebfc9" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="42" stroke="#aebfc9" stroke-width="2"/>
    <!-- singles under glass -->
    <rect x="14" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#d9442e"/>
    <rect x="40" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#3f8fc0"/>
    <rect x="66" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#e6c84a"/>
    <rect x="114" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#4fa24f"/>
    <rect x="140" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#6b4c8a"/>
    <rect x="214" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#d9442e"/>
    <rect x="240" y="8" width="18" height="26" rx="2" fill="#fff6e8" stroke="#3f8fc0"/>
    <text x="150" y="78" text-anchor="middle" font-size="11" fill="#3a2a10" font-weight="bold" font-style="italic">— singles —</text>
  </g>

  <!-- caption -->
  <rect x="290" y="524" width="320" height="28" rx="8" fill="#2a2440" stroke="#f4c430" stroke-width="2"/>
  <text x="450" y="543" text-anchor="middle" fill="#fff6df" font-size="13" font-weight="bold">THE LOCAL CARD SHOP — packs, singles, Friday duels</text>
</svg>
