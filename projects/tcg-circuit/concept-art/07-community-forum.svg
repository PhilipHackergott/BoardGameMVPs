  <text x="32" y="124" fill="#ffe9a0" font-size="14" font-weight="bold">Rate my Ember aggro for Regionals? (page 1 of 3)</text>

  <!-- POST 1 -->
  <g transform="translate(22,138)">
    <rect class="userbox" x="0" y="0" width="150" height="150"/>
    <rect x="46" y="12" width="58" height="58" fill="#2a1814" stroke="#d9442e" stroke-width="3"/>
    <polygon points="75,24 81,40 97,40 84,50 89,66 75,56 61,66 66,50 53,40 69,40" fill="#ffae4a"/>
    <text class="uname" x="75" y="88" text-anchor="middle">EmberLord99</text>
    <text class="rank" x="75" y="104" text-anchor="middle" fill="#d9442e" font-weight="bold">★★★ Veteran</text>
    <text class="rank" x="75" y="120" text-anchor="middle" fill="#5b6070">Posts: 1,204</text>
    <text class="rank" x="75" y="136" text-anchor="middle" fill="#5b6070">Joined: 2002</text>

    <rect class="post" x="150" y="0" width="706" height="150"/>
    <text x="162" y="18" fill="#5b6070" font-size="10">Posted: Mon 14:32 — #1</text>
    <text class="body" x="162" y="40">If you're going fast, you want 4x Ember Whelp and a low curve. Refract</text>
    <text class="body" x="162" y="58">aggressively turns 1-2 — you're racing their Nexus, not their board.</text>
    <text class="body" x="162" y="76">Cut the 5-drops. Two open lanes &gt; one big body when you're the beatdown.</text>
    <rect x="162" y="92" width="680" height="2" fill="#d8c24a"/>
    <text class="sig" x="162" y="112">— "Light is tempo. Spend it." | RC top 8 x3 | Ember til I die 🔥</text>
  </g>

  <!-- POST 2 (OP reply) -->
  <g transform="translate(22,300)">
    <rect class="userbox" x="0" y="0" width="150" height="150"/>
    <rect x="46" y="12" width="58" height="58" fill="#142634" stroke="#2e7fb8" stroke-width="3"/>
    <circle cx="75" cy="40" r="16" fill="#6fb8e0"/><circle cx="75" cy="36" r="6" fill="#cfeaf8"/>
    <text class="uname" x="75" y="88" text-anchor="middle">noob_brewer</text>
    <text class="rank" x="75" y="104" text-anchor="middle" fill="#4a9e4a" font-weight="bold">★ Rookie (OP)</text>
    <text class="rank" x="75" y="120" text-anchor="middle" fill="#5b6070">Posts: 12</text>
    <text class="rank" x="75" y="136" text-anchor="middle" fill="#5b6070">Joined: today</text>

    <rect class="post" x="150" y="0" width="706" height="150"/>
    <text x="162" y="18" fill="#5b6070" font-size="10">Posted: Mon 14:51 — #2</text>
    <rect x="162" y="28" width="680" height="36" fill="#efe6cc" stroke="#cdbf99"/>
    <text class="quote" x="170" y="44">&gt; cut the 5-drops, two open lanes &gt; one big body</text>
    <text class="quote" x="170" y="58">EmberLord99 wrote</text>
    <text class="body" x="162" y="84">omg thank you, that makes sense. but don't I die to Order go-wide if I</text>
    <text class="body" x="162" y="102">have no blockers?? my local meta is ALL Order + Tide control rn 😭</text>
    <text class="sig" x="162" y="134">— just trying to qualify before my mum makes me get a summer job</text>
  </g>

  <!-- POST 3 -->
  <g transform="translate(22,462)">
    <rect class="userbox" x="0" y="0" width="150" height="120"/>
    <rect x="46" y="12" width="58" height="58" fill="#221830" stroke="#7d5aa6" stroke-width="3"/>
    <circle cx="75" cy="42" r="15" fill="#9a7cc0"/><path d="M68 34 a10 10 0 1 0 12 14 a8 8 0 1 1 -12 -14" fill="#d3c2ec"/>
    <text class="uname" x="75" y="88" text-anchor="middle">TideMistress</text>
    <text class="rank" x="75" y="104" text-anchor="middle" fill="#7d5aa6" font-weight="bold">★★ Regular</text>

    <rect class="post" x="150" y="0" width="706" height="120"/>
    <text x="162" y="18" fill="#5b6070" font-size="10">Posted: Mon 15:07 — #3</text>
    <text class="body" x="162" y="40">Pierce. The answer is Pierce. Two cheap Pierce units laugh at Order walls</text>
    <text class="body" x="162" y="58">and still close. Also pls stop calling it "aggro," it's a *tempo* deck 🙄</text>
    <text class="sig" x="162" y="92">— TideMistress | moderator | "rate my deck" is not a strategy, friends</text>
  </g>

