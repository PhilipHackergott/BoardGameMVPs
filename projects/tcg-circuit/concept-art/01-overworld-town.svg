<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" font-family="'Trebuchet MS',sans-serif">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#5fa052"/>
      <rect width="20" height="20" fill="#57954b"/>
      <rect x="20" y="20" width="20" height="20" fill="#57954b"/>
    </pattern>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9573f"/><stop offset="1" stop-color="#b23a28"/>
    </linearGradient>
    <linearGradient id="roofBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fc0"/><stop offset="1" stop-color="#356a96"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f4b942"/>
    </linearGradient>
    <style>
      .lbl{fill:#fff6df;font-weight:bold;font-size:13px;text-anchor:middle;}
      .lblbg{fill:#2a2440;stroke:#f4c430;stroke-width:2;}
      .win{fill:#ffe9a8;}
      .wall{fill:#e9d6b3;stroke:#9c8460;stroke-width:2;}
    </style>
  </defs>

  <!-- base -->
  <rect width="800" height="640" fill="url(#grass)"/>
  <rect x="6" y="6" width="788" height="628" fill="none" stroke="#3f7036" stroke-width="12" rx="14"/>

  <!-- paths -->
  <g fill="#d9b97f" stroke="#c2a062" stroke-width="2">
    <rect x="384" y="150" width="34" height="420" rx="6"/>
    <rect x="170" y="180" width="230" height="30" rx="6"/>
    <rect x="400" y="120" width="220" height="30" rx="6"/>
    <rect x="400" y="330" width="220" height="30" rx="6"/>
    <rect x="250" y="470" width="170" height="30" rx="6"/>
  </g>

  <!-- pond -->
  <g>
    <ellipse cx="125" cy="540" rx="80" ry="52" fill="#3a7ca5"/>
    <ellipse cx="125" cy="540" rx="80" ry="52" fill="none" stroke="#2e5e8c" stroke-width="4"/>
    <ellipse cx="105" cy="525" rx="22" ry="10" fill="#5fa3c9" opacity="0.7"/>
  </g>

  <!-- trees -->
  <g>
    <g transform="translate(235,120)"><rect x="-5" y="14" width="10" height="16" fill="#6b3f1d"/><circle r="22" fill="#3f7d39"/><circle r="14" fill="#4f9447" cx="-6" cy="-6"/></g>
    <g transform="translate(560,470)"><rect x="-5" y="14" width="10" height="16" fill="#6b3f1d"/><circle r="22" fill="#3f7d39"/><circle r="14" fill="#4f9447" cx="-6" cy="-6"/></g>
    <g transform="translate(700,540)"><rect x="-5" y="14" width="10" height="16" fill="#6b3f1d"/><circle r="22" fill="#3f7d39"/><circle r="14" fill="#4f9447" cx="-6" cy="-6"/></g>
    <g transform="translate(110,300)"><rect x="-5" y="14" width="10" height="16" fill="#6b3f1d"/><circle r="20" fill="#3f7d39"/><circle r="12" fill="#4f9447" cx="-6" cy="-6"/></g>
  </g>

  <!-- HOME -->
  <g transform="translate(80,70)">
    <rect class="wall" x="0" y="40" width="120" height="80" rx="4"/>
    <polygon points="-8,40 60,4 128,40" fill="url(#roof)" stroke="#8a2c1d" stroke-width="2"/>
    <rect class="win" x="14" y="58" width="22" height="22" rx="2" stroke="#9c8460" stroke-width="2"/>
    <rect x="50" y="70" width="26" height="50" fill="#8b5a2b" stroke="#5e3c1c" stroke-width="2"/>
    <rect class="win" x="86" y="58" width="22" height="22" rx="2" stroke="#9c8460" stroke-width="2"/>
    <rect class="lblbg" x="22" y="124" width="76" height="22" rx="6"/><text class="lbl" x="60" y="139">HOME</text>
  </g>

  <!-- SCHOOL / UNI -->
  <g transform="translate(560,60)">
    <rect class="wall" x="0" y="34" width="170" height="96" rx="4"/>
    <polygon points="-8,34 85,2 178,34" fill="url(#roofBlue)" stroke="#2a527a" stroke-width="2"/>
    <rect x="74" y="-26" width="8" height="34" fill="#caa24a"/><polygon points="82,-26 82,-10 110,-18" fill="#d9573f"/>
    <rect class="win" x="16" y="52" width="20" height="22" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="50" y="52" width="20" height="22" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="100" y="52" width="20" height="22" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="134" y="52" width="20" height="22" stroke="#9c8460" stroke-width="2"/>
    <rect x="74" y="88" width="30" height="42" fill="#8b5a2b" stroke="#5e3c1c" stroke-width="2"/>
    <rect class="lblbg" x="38" y="134" width="96" height="22" rx="6"/><text class="lbl" x="86" y="149">SCHOOL / UNI</text>
  </g>

  <!-- LOCAL CARD SHOP (the hub) -->
  <g transform="translate(310,230)">
    <ellipse cx="95" cy="150" rx="130" ry="30" fill="#f4d77a" opacity="0.35"/>
    <rect class="wall" x="0" y="44" width="190" height="106" rx="5" fill="#f0dcb6"/>
    <polygon points="-10,44 95,6 200,44" fill="url(#glow)" stroke="#c98f1e" stroke-width="2"/>
    <!-- warm windows -->
    <rect x="16" y="66" width="50" height="40" rx="3" fill="#ffd96b" stroke="#c98f1e" stroke-width="2"/>
    <rect x="124" y="66" width="50" height="40" rx="3" fill="#ffd96b" stroke="#c98f1e" stroke-width="2"/>
    <rect x="78" y="92" width="34" height="58" fill="#a9702f" stroke="#5e3c1c" stroke-width="2"/>
    <!-- hanging sign with star/foil -->
    <rect x="56" y="-2" width="78" height="44" rx="6" fill="#2a2440" stroke="#f4c430" stroke-width="3"/>
    <polygon points="95,8 100,20 113,20 102,28 106,40 95,33 84,40 88,28 77,20 90,20" fill="#ffe08a"/>
    <rect class="lblbg" x="30" y="154" width="130" height="24" rx="7" fill="#1f3a2a" stroke="#7ad17a"/>
    <text class="lbl" x="95" y="170" fill="#d8ffd8">LOCAL CARD SHOP</text>
    <text x="95" y="196" text-anchor="middle" fill="#fff6df" font-size="11" font-style="italic">— the heart of the scene —</text>
  </g>

  <!-- TOURNAMENT HALL -->
  <g transform="translate(250,455)">
    <rect class="wall" x="0" y="30" width="290" height="100" rx="5" fill="#e6cfa6"/>
    <polygon points="-10,30 145,0 300,30" fill="#6b4c8a" stroke="#4c356a" stroke-width="2"/>
    <rect x="120" y="70" width="50" height="60" fill="#8b5a2b" stroke="#5e3c1c" stroke-width="2"/>
    <rect class="win" x="24" y="52" width="26" height="26" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="64" y="52" width="26" height="26" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="200" y="52" width="26" height="26" stroke="#9c8460" stroke-width="2"/>
    <rect class="win" x="240" y="52" width="26" height="26" stroke="#9c8460" stroke-width="2"/>
    <!-- banner -->
    <rect x="95" y="14" width="100" height="20" rx="4" fill="#d9442e" stroke="#fff" stroke-width="2"/>
    <text x="145" y="29" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">★ TOURNAMENT ★</text>
    <rect class="lblbg" x="78" y="134" width="134" height="22" rx="6"/><text class="lbl" x="145" y="149">TOURNAMENT HALL</text>
  </g>

  <!-- road sign to regionals -->
  <g transform="translate(690,210)">
    <rect x="14" y="20" width="8" height="40" fill="#8b5a2b"/>
    <rect x="-30" y="-2" width="78" height="26" rx="4" fill="#caa24a" stroke="#7a5a20" stroke-width="2"/>
    <text x="9" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a2a10">REGIONALS →</text>
  </g>

  <!-- player sprite -->
  <g transform="translate(392,300)">
    <ellipse cx="9" cy="34" rx="14" ry="5" fill="#000" opacity="0.2"/>
    <rect x="-1" y="16" width="20" height="20" rx="4" fill="#d9442e"/>
    <circle cx="9" cy="8" r="11" fill="#f1c79b" stroke="#caa278" stroke-width="1.5"/>
    <path d="M -3 4 Q 9 -10 21 4 L 21 -1 Q 9 -8 -3 -1 Z" fill="#3a2a1a"/>
    <rect x="-4" y="36" width="8" height="9" rx="2" fill="#2a2440"/><rect x="14" y="36" width="8" height="9" rx="2" fill="#2a2440"/>
  </g>

  <!-- title plate -->
  <rect x="250" y="600" width="300" height="30" rx="8" fill="#2a2440" stroke="#f4c430" stroke-width="2"/>
  <text x="400" y="620" text-anchor="middle" fill="#fff6df" font-size="14" font-weight="bold">OVERWORLD — the scene as places you walk</text>
</svg>
